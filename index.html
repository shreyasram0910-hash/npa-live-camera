<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPA Live Visit Camera</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      text-align: center;
      padding: 15px;
      color: #222;
    }

    video, img {
      width: 100%;
      max-width: 480px;
      border-radius: 10px;
      background: #222;
    }

    button {
      padding: 14px 22px;
      margin: 8px;
      border: 0;
      border-radius: 8px;
      background: #0759bd;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #switchCamera {
      background: #198754;
    }

    #status {
      margin: 15px;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <h2>NPA Live Visit Camera</h2>
  <p>Capture a fresh live photo for the NPA visit.</p>

  <video id="video" autoplay playsinline class="hidden"></video>

  <br>

  <button id="start">OPEN CAMERA</button>

  <button id="switchCamera" disabled>
    SWITCH FRONT / BACK
  </button>

  <button id="capture" disabled>
    CAPTURE PHOTO
  </button>

  <canvas id="canvas" hidden></canvas>

  <br>

  <img id="preview" hidden alt="Captured photo">

  <p id="status">Ready to open back camera.</p>

  <script>

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const statusText = document.getElementById('status');

    const captureBtn = document.getElementById('capture');
    const startBtn = document.getElementById('start');
    const switchBtn = document.getElementById('switchCamera');

    const params = new URLSearchParams(location.search);

    const token = params.get('token');
    const parentOrigin = params.get('parentOrigin');

    let stream = null;
    let currentFacingMode = 'environment';
    let cameraBusy = false;

    if (!token || !parentOrigin) {
      statusText.textContent =
        'Invalid camera session. Please open the camera from the NPA app.';
      startBtn.disabled = true;
    }

    // OPEN CAMERA
    async function openCamera() {

      if (cameraBusy) return;

      cameraBusy = true;
      startBtn.disabled = true;
      switchBtn.disabled = true;
      captureBtn.disabled = true;

      try {

        stopCamera();

        statusText.textContent =
          currentFacingMode === 'environment'
            ? 'Opening back camera...'
            : 'Opening front camera...';

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            'Camera is not supported. Please use Chrome or Safari.'
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 1280 }
          }
        });

        video.srcObject = stream;
        video.classList.remove('hidden');

        await video.play();

        captureBtn.disabled = false;
        switchBtn.disabled = false;

        startBtn.textContent = 'CAMERA OPENED';

        statusText.textContent =
          currentFacingMode === 'environment'
            ? 'BACK CAMERA READY. Capture your photo or switch camera.'
            : 'FRONT CAMERA READY. Capture your photo or switch camera.';

      } catch (error) {

        stopCamera();

        statusText.textContent =
          'Camera error: ' + error.name + '\n' + error.message;

        startBtn.disabled = false;
        startBtn.textContent = 'RETRY OPEN CAMERA';

      } finally {
        cameraBusy = false;
      }
    }

    // SWITCH FRONT / BACK CAMERA
    async function switchCamera() {

      if (cameraBusy || !stream) return;

      currentFacingMode =
        currentFacingMode === 'environment'
          ? 'user'
          : 'environment';

      await openCamera();
    }

    startBtn.onclick = function() {
      openCamera();
    };

    switchBtn.onclick = function() {
      switchCamera();
    };

    // CAPTURE LIVE PHOTO
    captureBtn.onclick = function() {

      if (!stream || !video.videoWidth) {
        statusText.textContent =
          'Please open the camera first.';
        return;
      }

      captureBtn.disabled = true;
      switchBtn.disabled = true;
      startBtn.disabled = true;

      const maxWidth = 1280;

      let width = video.videoWidth;
      let height = video.videoHeight;

      if (width > height && width > maxWidth) {
        height = Math.round(height * maxWidth / width);
        width = maxWidth;
      } else if (height >= width && height > maxWidth) {
        width = Math.round(width * maxWidth / height);
        height = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;

      canvas.getContext('2d').drawImage(
        video, 0, 0, width, height
      );

      const photoData = canvas.toDataURL(
        'image/jpeg',
        0.72
      );

      preview.src = photoData;
      preview.hidden = false;

      stopCamera();

      statusText.textContent =
        'Photo captured. Sending to NPA app...';

      try {

        if (!window.opener || window.opener.closed) {
          throw new Error(
            'NPA app window not found. Reopen camera from NPA app.'
          );
        }

        window.opener.postMessage(
          {
            type: 'NPA_CAMERA_PHOTO',
            token: token,
            photoData: photoData
          },
          parentOrigin
        );

        statusText.textContent =
          'Photo sent successfully to NPA app.';

        setTimeout(function() {
          window.close();
        }, 1500);

      } catch (error) {

        statusText.textContent =
          'Unable to send photo: ' + error.message;

        startBtn.disabled = false;
        startBtn.textContent = 'OPEN CAMERA AGAIN';
      }
    };

    // STOP CAMERA
    function stopCamera() {

      if (stream) {
        stream.getTracks().forEach(track => {
          track.stop();
        });

        stream = null;
      }

      video.srcObject = null;
    }

    window.addEventListener('beforeunload', stopCamera);

  </script>

</body>
</html>
